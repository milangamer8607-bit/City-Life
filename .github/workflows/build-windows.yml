
name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: lihop/setup-godot@v3
        with:
          version: 4.3-stable
          export-templates: true

      - name: Export Windows game
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null

          godot --headless --path . --export-release "Windows Desktop" "build/CityLife.exe"

          Write-Host "Suche exportierte EXE..."

          $exe = Get-ChildItem -Path . -Filter "CityLife*.exe" -Recurse -File |
            Where-Object { $_.FullName -notmatch "\\.git\\" } |
            Select-Object -First 1

          if ($null -eq $exe) {
            Write-Host "Dateien im Projekt:"
            Get-ChildItem -Path . -Recurse -File |
              Select-Object -ExpandProperty FullName

            throw "CityLife.exe wurde nicht exportiert!"
          }

          Write-Host "Gefunden: $($exe.FullName)"

          if ($exe.FullName -ne (Join-Path $PWD "build/CityLife.exe")) {
            Copy-Item $exe.FullName "build/CityLife.exe" -Force
          }

          if (!(Test-Path "build/CityLife.exe")) {
            throw "Die EXE fehlt im Build-Ordner!"
          }

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: CityLife-Windows
          path: build/CityLife.exe
          if-no-files-found: error
