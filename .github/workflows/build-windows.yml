
name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: lihop/setup-godot@v3
        with:
          version: 4.3-stable
          export-templates: true

      - name: Export Windows game
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          godot --headless --path . --export-release "Windows Desktop" CityLife.exe

      - name: Find and prepare executable
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path . -Filter "CityLife.exe" -Recurse |
            Where-Object { $_.FullName -notmatch '\\.godot\\' } |
            Select-Object -First 1

          if (!$exe) {
            Write-Error "CityLife.exe wurde nicht gefunden!"
            exit 1
          }

          New-Item -ItemType Directory -Force -Path build | Out-Null
          Copy-Item $exe.FullName "build/CityLife.exe" -Force

          Write-Host "EXE gefunden: $($exe.FullName)"

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: CityLife-Windows
          path: build/CityLife.exe
