
name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: lihop/setup-godot@v3
        with:
          version: 4.3-stable
          export-templates: true

      - name: Export Windows game
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build
          godot --headless --path . --export-release "Windows Desktop" build/CityLife.exe

      - name: Check executable
        shell: pwsh
        run: |
          if (!(Test-Path "build/CityLife.exe")) {
            Write-Error "CityLife.exe wurde nicht erstellt!"
            exit 1
          }

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: CityLife-Windows
          path: build/CityLife.exe
